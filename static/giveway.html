<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка Победителей Розыгрыша</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Использование кастомного шрифта для лучшей эстетики */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Темный фон для демонстрации карточки */
        }
        /* Пользовательский градиент для текста */
        .gradient-text {
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        /* Фон и граница карточки */
        .card-bg {
            background-color: #1f2937;
            border: 1px solid #374151;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Карточка Победителей Розыгрыша -->
    <div class="max-w-xs w-full card-bg rounded-xl shadow-2xl p-6">
        <div class="flex flex-col items-center space-y-5">
            
            <!-- Заголовок -->
            <div class="text-center">
                <h2 class="text-2xl font-bold gradient-text">
                    Победители Розыгрыша
                </h2>
                <p class="text-gray-400 text-sm mt-1">Поздравляем с победой!</p>
            </div>

            <!-- 
                Список Победителей (Jinja2)
                Ожидается список объектов 'winners', где каждый объект имеет 'username' и 'avatar'.
                Например: winners = [
                    {'username': 'User1', 'avatar': 'url_to_avatar1'},
                    {'username': 'User2', 'avatar': 'url_to_avatar2'},
                ]
            -->
            <div class="w-full space-y-3">

                {% for winner in winners %}
                <div class="flex items-center space-x-4 p-2.5 bg-gray-700/40 rounded-lg transition-all duration-300 hover:bg-gray-700/60 hover:scale-105">
                    {% if loop.first %}
                        <!-- Особый стиль для первого места -->
                        <span class="text-xl font-bold text-violet-400 w-8 text-center">{{ loop.index }}</span>
                        <img class="w-10 h-10 rounded-full object-cover border-2 border-violet-400" src="{{ winner.avatar }}" alt="Аватар" onerror="this.onerror=null;this.src='https://placehold.co/40x40/1f2937/e5e7eb?text=E';">
                    {% else %}
                        <!-- Стандартный стиль для остальных мест -->
                        <span class="text-xl font-bold text-gray-300 w-8 text-center">{{ loop.index }}</span>
                        <img class="w-10 h-10 rounded-full object-cover border-2 border-gray-600" src="{{ winner.avatar }}" alt="Аватар" onerror="this.onerror=null;this.src='https://placehold.co/40x40/1f2937/e5e7eb?text=E';">
                    {% endif %}
                    <div class="flex-1">
                        <p class="text-md font-medium text-white">{{ winner.name }}</p>
                    </div>
                </div>
                {% endfor %}
                
            </div>
        </div>
    </div>

</body>
</html>
